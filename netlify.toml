[build]
  command = "npm run build"
  publish = ".next"
  # Force the build to succeed even with static generation errors
  ignore_errors = true

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_FLAGS = "--no-audit --production=false"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NEXT_PUBLIC_SKIP_AUTH_PAGES = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Force SSR for auth routes to prevent build-time errors
[[redirects]]
  from = "/api/auth/*"
  to = "/api/auth/:splat"
  status = 200
  force = true

# Force SSR for admin routes to prevent SessionProvider errors
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true

# Force SSR for sponsor routes to prevent SessionProvider errors
[[redirects]]
  from = "/sponsors/*"
  to = "/sponsors/:splat"
  status = 200
  force = true

# Force SSR for member routes to prevent SessionProvider errors
[[redirects]]
  from = "/member/*"
  to = "/member/:splat"
  status = 200
  force = true

# Force SSR for dashboard routes to prevent SessionProvider errors
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/:splat"
  status = 200
  force = true

# Force SSR for profile routes to prevent SessionProvider errors
[[redirects]]
  from = "/profile/*"
  to = "/profile/:splat"
  status = 200
  force = true

# Force SSR for account routes to prevent SessionProvider errors
[[redirects]]
  from = "/account/*"
  to = "/account/:splat"
  status = 200
  force = true

# Handle 404s
[[redirects]]
  from = "/*"
  to = "/_error"
  status = 404