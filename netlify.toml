[build]
  command = "npm run build:netlify"
  publish = ".next"
  # Ignore build errors related to static generation of dynamic routes
  # This allows the build to succeed even if some pages fail during static generation
  ignore_errors = true

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_FLAGS = "--no-audit --production=false"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Force SSR for auth routes to prevent build-time errors
[[redirects]]
  from = "/api/auth/*"
  to = "/api/auth/:splat"
  status = 200
  force = true

# Force SSR for admin routes to prevent SessionProvider errors
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true

# Force SSR for sponsor routes to prevent SessionProvider errors
[[redirects]]
  from = "/sponsors/*"
  to = "/sponsors/:splat"
  status = 200
  force = true

# Handle 404s
[[redirects]]
  from = "/*"
  to = "/_error"
  status = 404